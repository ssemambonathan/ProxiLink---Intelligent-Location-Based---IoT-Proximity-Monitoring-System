org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The project lives under a synchronised Documents folder on Windows; Kotlin
# incremental caches intermittently fail to close there ("Could not close
# incremental caches"), so incremental compilation is disabled for reliable builds.
kotlin.incremental=false
